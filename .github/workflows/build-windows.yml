name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-vst3:
    runs-on: windows-latest
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v5

      - name: Download JUCE
        shell: pwsh
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure project
        shell: pwsh
        run: cmake -S . -B build -DJUCE_DIR="$env:GITHUB_WORKSPACE/JUCE" -A x64

      - name: Compile VST3
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build" -Directory -Filter "*.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) {
            Write-Host "No .vst3 bundle was found. Build output follows:"
            Get-ChildItem -Path "build" -Recurse | Select-Object -ExpandProperty FullName
            throw "VST3 build output not found."
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination "dist" -Recurse
          Write-Host "Packaged $($plugin.FullName)"

      - name: Upload compiled VST3
        uses: actions/upload-artifact@v5
        with:
          name: Pulse-Visual-Metronome-Windows-VST3
          path: dist/
          if-no-files-found: error
          compression-level: 6
